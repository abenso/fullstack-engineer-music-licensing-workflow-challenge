name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

env:
  DATABASE_URL: postgres://licensing:licensing@localhost:5432/licensing
  # sqlx::query!/query_as! use the checked-in .sqlx/ cache instead of
  # requiring a live, migrated database just to compile.
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest

    # Backs the integration tests (each gets its own database, created and
    # migrated automatically by #[sqlx::test]).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licensing
          POSTGRES_PASSWORD: licensing
          POSTGRES_DB: licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licensing -d licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Runs the full suite (unit + integration) and fails the job if line
      # coverage drops below 80%.
      - name: Test with coverage (min 80% lines)
        run: cargo llvm-cov --all-targets --fail-under-lines 80
